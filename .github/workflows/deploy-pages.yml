name: Deploy React Dashboard to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    # Poll the US draw window hourly; includes DST and standard-time offsets.
    - cron: "15 0-4,14-23 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test React application
        run: npm test

      - name: Build web application
        run: npm run build
        env:
          VITE_BASE_PATH: /choloto-dashboard/

      - name: Fetch official New York results
        run: >-
          node tools/fetch_new_york_results.mjs
          dist/data/official-new-york-results.json

      - name: Fetch additional US lottery results
        run: >-
          node tools/fetch_additional_lottery_results.mjs
          dist/data/official-additional-lottery-results.json

      - name: Add GitHub Pages files
        run: |
          touch dist/.nojekyll
          cp dist/index.html dist/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
